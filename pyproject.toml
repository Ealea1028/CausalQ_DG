[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "causalq-dg"
version = "0.1.0"
description = "Counterfactual Query Effect Distillation for DG semantic segmentation"
requires-python = ">=3.12,<3.14"

[tool.setuptools.packages.find]
include = ["causalq*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
